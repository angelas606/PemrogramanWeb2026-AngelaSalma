<!DOCTYPE html>
<html lang="en">

    <title>Login - SIMPUS-Mini</title>

</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
    </header>

    <main>
        <h2>Login Petugas</h2>
        <form>
            <p>
                <label for="usernane">Username</label>

            </p>
            <p>
                <button type="submit">Masuk</button>
            </p>
        </form>
        <p>
            Belum punya akun?

        </p>
    </main>
</body>
